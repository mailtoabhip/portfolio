<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery truck · asset preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce0df;color:#162327;font-family:Arial,sans-serif}canvas{display:block}
header{position:absolute;top:28px;left:32px;pointer-events:none}small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#58676b}h1{font-size:28px;letter-spacing:-.04em;margin:8px 0;font-weight:500}p{font-size:13px;line-height:1.7;margin:5px 0;color:#536266}
nav{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#f5f5f0dd;padding:6px;border:1px solid #fff9;border-radius:14px;box-shadow:0 8px 30px #27353515;flex-wrap:wrap;justify-content:center;max-width:95%;width:max-content}
button,select{border:0;background:transparent;color:#33474a;padding:11px 16px;border-radius:9px;cursor:pointer;font:12px Arial,sans-serif}button:hover,button[aria-pressed=true]{background:#203b3d;color:white}select{background:#e7ebe7}
#status{position:absolute;right:30px;top:32px;font-size:12px;color:#536266}#error{position:absolute;top:40%;left:50%;transform:translateX(-50%);width:min(580px,85vw);color:#823b30;line-height:1.7;text-align:center} #error a{color:#203b3d} button:disabled,select:disabled{opacity:.5;cursor:default}
@media(max-width:700px){header{top:16px;left:18px}h1{font-size:22px}#status{top:90px;left:18px;right:auto}button,select{padding:9px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head><body>
<header><small>THE NIGHT RUN · ORIGINAL ASSET STUDY</small><h1 id="title">Silver cab. Midnight cargo.</h1><p id="caption">Detailed truck geometry · separate wheel pivots · physical materials</p></header>
<div id="status">Loading model…</div><div id="error" role="alert"></div>
<nav aria-label="Asset preview controls">
<select id="asset" aria-label="Asset"><option value="delivery-rigid-truck.glb">Rigid delivery truck</option><option value="delivery-tractor-trailer.glb">Tractor & trailer</option><option value="forest-pine.glb">Forest pine</option><option value="forest-fir.glb">Forest fir</option><option value="forest-birch.glb">Forest birch</option><option value="roadside-rock.glb">Roadside rock</option></select>
<button id="front" aria-pressed="true">Front ¾</button><button id="rear" aria-pressed="false">Rear ¾</button><button id="side" aria-pressed="false">Side</button><button id="spin" aria-pressed="false">Rotate</button>
</nav>
<script>
(function () {
  const status = document.getElementById('status');
  const error = document.getElementById('error');
  function fail(message) {
    status.textContent = 'Preview could not start';
    error.textContent = message;
  }
  if (location.protocol === 'file:') {
    status.textContent = 'Start the local preview';
    error.innerHTML = 'This preview needs a local server. Double-click <strong>Start Preview.cmd</strong> in this folder, then open <a href="http://127.0.0.1:3118/">http://127.0.0.1:3118/</a>. Opening index.html directly cannot load the 3D files.';
    document.querySelectorAll('nav button, nav select').forEach(function (control) { control.disabled = true; });
    return;
  }
  const timer = setTimeout(function () {
    fail('The preview is taking too long to start. Reload once and check that the preview server is still running.');
  }, 30000);
  import('./viewer.js').then(function () { clearTimeout(timer); }).catch(function (e) {
    clearTimeout(timer);
    fail('The 3D preview could not initialize. Check that WebGL is available and all viewer files were extracted together. Details: ' + e.message);
    console.error(e);
  });
}());
</script></body></html>
